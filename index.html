<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приватное сообщение</title>
    <style>
        /* Общие стили и фон, похожий на темную тему десктопного Telegram */
        body {
            background-color: #1e2226;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Карточка по центру экрана */
        .card {
            background-color: #2b3035;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        /* Красный бейдж уведомления (единичка) */
        .badge {
            background-color: #ff3b30;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            border: 4px solid #1e2226;
        }

        /* Заголовки и текст */
        h2 {
            margin: 20px 0 12px;
            font-size: 22px;
            font-weight: 600;
        }

        p {
            color: #aeb5bc;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* Кнопка в стиле Telegram */
        .btn {
            background-color: #2AABEE;
            color: #ffffff;
            text-decoration: none;
            display: block;
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(42, 171, 238, 0.3);
        }

        .btn:hover {
            background-color: #2298d6;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Анимация пульсации для бейджа, чтобы привлекать внимание */
        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .badge {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">1</div>
        <h2>1 новое сообщение 💌</h2>
        <p>Собеседница ждет вас в чате и уже загрузила приватное фото. Откройте Telegram 👇, чтобы посмотреть.</p>
        
        <a href="https://t.me/tvoyanastiutytbot?start=secret" class="btn" onclick="triggerPixel()">
            Открыть чат и посмотреть 🔞
        </a>
    </div>

    <script>
        function triggerPixel() {
            // Сюда можно добавить код пикселя, например:
            // fbq('track', 'Lead');
            // yaCounterXXXXXX.reachGoal('click_to_tg');
            console.log("Юзер кликнул по кнопке, переходим в тг");
        }
    </script>

</body>
</html>
